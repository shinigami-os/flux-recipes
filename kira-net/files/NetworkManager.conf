[main]
plugins=keyfile

[keyfile]

# Alpine builds NetworkManager with ifupdown as the compiled-in default plugin, which treats any
# interface absent from /etc/network/interfaces (which Kira doesn't use) as unmanaged
[ifupdown]
managed=true

# iwd is already deployed as its own runit service (see files/iwd/run) - delegate
# wifi management to it instead of NetworkManager spawning its own wpa_supplicant,
# which would otherwise fight iwd for control of the radio
[device]
wifi.backend=iwd

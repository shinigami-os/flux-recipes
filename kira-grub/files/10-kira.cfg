# Kira Linux's GRUB defaults, read last by /etc/default/grub, so they win over it.
# Keep your own changes in a file of their own here (20-local.cfg), then run:
#   grub-mkconfig -o /boot/grub/grub.cfg
GRUB_DISTRIBUTOR="Kira Linux"
GRUB_DEFAULT=0
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_DISABLE_SUBMENU=false
GRUB_DISABLE_RECOVERY=true
GRUB_DISABLE_OS_PROBER=false
GRUB_TERMINAL_OUTPUT=gfxterm
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_THEME=/usr/share/kira-grub/themes/kira/theme.txt
